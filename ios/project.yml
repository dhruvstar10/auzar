# XcodeGen spec. Regenerate the Xcode project with:  cd ios && xcodegen
name: SBSI
options:
  bundleIdPrefix: com.dhruvgoel
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  SBSI:
    type: application
    platform: iOS
    sources: [SBSI]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhruvgoel.sbsi
        INFOPLIST_FILE: SBSI/Info.plist
        CODE_SIGN_ENTITLEMENTS: SBSI/SBSI.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
